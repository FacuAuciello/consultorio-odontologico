spring.application.name=consultorio-odontologico-api

# ---------------------------------------------------------------------------------------------
# Base de datos (MySQL). La URL y el usuario salen de variables de entorno; el valor despues de ":" es el default para desarrollo local
# ---------------------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/consultorio_odontologico?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
# sin default a proposito: si falta, la app NO arranca (mejor fallar que usar una clave por defecto)
spring.datasource.password=${DB_PASSWORD}

# "update" crea/actualiza las tablas a partir de las entidades: comodo para desarrollo.
# En un entorno productivo real lo correcto es usar migraciones versionadas (Flyway o Liquibase) y poner "validate"
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# false = las entidades se cargan SOLO dentro de los @Transactional de los services.
# Evita el "open session in view" (consultas SQL escondidas en la capa de controllers o al serializar el JSON)
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------------------------
# Seguridad (sesion + CORS)
# ---------------------------------------------------------------------------------------------
# La sesion vive en el servidor y el navegador solo guarda una cookie (JSESSIONID) con un identificador.
# Vence a las 8 horas sin actividad: alcanza para una jornada de trabajo sin pedir la clave a cada rato
server.servlet.session.timeout=8h
# HttpOnly (por defecto) evita que JavaScript lea la cookie; SameSite=Lax evita que otro sitio la use para mandar pedidos en nombre de la secretaria
server.servlet.session.cookie.same-site=lax
# en produccion, con HTTPS, definir SESSION_COOKIE_SECURE=true para que la cookie viaje solo cifrada
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# origen del front permitido por CORS; en produccion se define con el dominio real (se pueden separar varios con coma)
app.cors.origen-permitido=${CORS_ORIGEN:http://localhost:5173}

# usuario inicial del sistema. Se crea al arrancar SOLO si ambos valores estan definidos y todavia no existe.
# La contrasenia se guarda hasheada con BCrypt (nunca en texto plano)
app.admin.usuario=${ADMIN_USUARIO:}
app.admin.contrasenia=${ADMIN_CONTRASENIA:}

# ---------------------------------------------------------------------------------------------
# Reglas de la agenda: el back las valida y el front las consulta (GET /api/agenda/configuracion),
# asi el horario del consultorio vive en UN solo lugar
# ---------------------------------------------------------------------------------------------
consultorio.agenda.hora-inicio=08:00
consultorio.agenda.hora-fin=12:30
consultorio.agenda.dias-laborales=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
consultorio.agenda.duraciones-permitidas=30,60
# los turnos tienen que empezar en multiplos de este intervalo (08:00, 08:30, 09:00...)
consultorio.agenda.intervalo-minutos=30

# ---------------------------------------------------------------------------------------------
# Errores: defensa en profundidad. Los errores que genera Spring antes de llegar al manejador global (/error)
# nunca incluyen mensaje, stack ni detalle de validacion
# ---------------------------------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
